<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do-App – Lektion 16 (Lösung)</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>📝 Meine Aufgaben</h1>

    <div class="eingabe-bereich">
      <input type="text" id="aufgabe-eingabe" placeholder="Neue Aufgabe eingeben…">
      <button id="hinzufuegen-btn">Hinzufügen</button>
    </div>

    <div class="filter-bereich">
      <button class="filter-btn aktiv" data-filter="alle">Alle</button>
      <button class="filter-btn" data-filter="offen">Offen</button>
      <button class="filter-btn" data-filter="erledigt">Erledigt</button>
    </div>

    <ul id="aufgaben-liste"></ul>

    <p id="aufgaben-zaehler">0 offene Aufgaben</p>
  </div>

  <script src="script.js"></script>
</body>
</html>
